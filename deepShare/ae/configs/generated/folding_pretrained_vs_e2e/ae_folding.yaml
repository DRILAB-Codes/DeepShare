data:
  train_dir: data/ae/train
  val_dir: data/ae/val
  test_dir: data/ae/test
  input_num_points: 64
  target_num_points: 128
  include_miss: false
  normalize: true
model:
  encoder_mode: msg
  latent_dim: 128
  base_radius: 1.0
  npoint1: 32
  npoint2: 16
  decoder_mode: folding
  input_channels: 1
  output_dim: 3
training:
  out_dir: out/folding_pretrained_vs_e2e/ae_pretrain
  batch_size: 128
  epochs: 200
  lr: 0.001
  patience: 20
  min_delta: 1.0e-05
  num_workers: 4
  save_every: 10
  seed: 42
